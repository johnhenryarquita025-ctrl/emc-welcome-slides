<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #slide-viewport {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #slide-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #controls-bar {
      height: 60px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background: #555;
    }
    #drawer {
      position: absolute;
      right: -300px;
      top: 0;
      width: 300px;
      height: 100%;
      background: #222;
      transition: right 0.3s ease;
      overflow-y: auto;
      padding: 10px;
    }
    #drawer.open {
      right: 0;
    }
    .drawer-item {
      margin-bottom: 10px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .drawer-item.active {
      border-color: #00aaff;
    }
    .drawer-item img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="slide-viewport">
      <img id="slide-image" src="" alt="Slide Viewport">
    </div>

    <div id="controls-bar">
      <div class="btn-group">
        <button id="prev-btn">Prev</button>
        <button id="play-btn">Play</button>
        <button id="next-btn">Next</button>
      </div>
      <div class="btn-group">
        <button id="drawer-toggle">Slides</button>
      </div>
    </div>

    <div id="drawer"></div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const CLOUDFLARE_BASE_URL = "https://emc-welcome.pages.dev/";

    let activeAudience = "Audience1";
    let activeLevel = "Level1";
    let activeSP = "SP1";

    let slideOrder = [];
    let currentSlideIndex = 0;
    let isPlaying = false;
    let workingTemplate = null;

    const slideImage = document.getElementById('slide-image');
    const audioPlayer = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const drawerToggle = document.getElementById('drawer-toggle');
    const drawer = document.getElementById('drawer');

    // Helper to check if an image URL exists
    function checkImageExists(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    // Resolve base path pattern dynamically
    async function resolveWorkingTemplate(num) {
      if (workingTemplate) return workingTemplate(num);

      const candidatePaths = [
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience}/${activeLevel}/${activeSP}/Slide${num}.PNG`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience}/${activeLevel}/${activeSP}/Slide${num}.png`,
        `${CLOUDFLARE_BASE_URL}Level/${activeLevel}/${activeSP}/Slide${num}.PNG`,
        `${CLOUDFLARE_BASE_URL}Level/${activeLevel}/${activeSP}/Slide${num}.png`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience} Level/${activeLevel}/${activeSP}/Slide${num}.PNG`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience} Level/${activeLevel}/${activeSP}/Slide${num}.png`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience} Level/${activeLevel}/${activeSP}/Slide ${num}.PNG`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience} Level/${activeLevel}/${activeSP}/Slide ${num}.png`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience}/${activeLevel}/${activeSP}/Slide ${num}.PNG`,
        `${CLOUDFLARE_BASE_URL}Level/${activeAudience}/${activeLevel}/${activeSP}/Slide ${num}.png`
      ];

      for (const path of candidatePaths) {
        const exists = await checkImageExists(path);
        if (exists) {
          const hasSpace = path.includes(`Slide ${num}`);
          const pattern = hasSpace ? `Slide ${num}` : `Slide${num}`;
          const ext = path.slice(path.lastIndexOf('.'));
          const base = path.substring(0, path.lastIndexOf(pattern));

          workingTemplate = (n) => `${base}${hasSpace ? 'Slide ' : 'Slide'}${n}${ext}`;
          return workingTemplate(num);
        }
      }
      return null;
    }

    // Optimized Parallel Batch Loading
    async function countAndLoadSlides() {
      workingTemplate = null;
      slideOrder = [];

      const firstSlidePath = await resolveWorkingTemplate(1);
      if (!firstSlidePath) {
        slideOrder = [1];
        updateSlideImage();
        renderSlideDrawerItems();
        return;
      }

      slideOrder.push(1);
      let batchSize = 10;
      let currentIndex = 2;
      let keepScanning = true;

      while (keepScanning) {
        const batchProms = [];
        for (let i = 0; i < batchSize; i++) {
          const slideNum = currentIndex + i;
          const url = workingTemplate(slideNum);
          batchProms.push(checkImageExists(url).then(exists => ({ slideNum, exists })));
        }

        const results = await Promise.all(batchProms);
        for (const res of results) {
          if (res.exists) {
            slideOrder.push(res.slideNum);
          } else {
            keepScanning = false;
            break;
          }
        }
        currentIndex += batchSize;
      }

      currentSlideIndex = 0;
      updateSlideImage();
      renderSlideDrawerItems();
    }

    function updateSlideImage() {
      if (slideOrder.length === 0) return;
      const currentSlideNum = slideOrder[currentSlideIndex];
      if (workingTemplate) {
        slideImage.src = workingTemplate(currentSlideNum);
      }
    }

    function renderSlideDrawerItems() {
      drawer.innerHTML = '';
      slideOrder.forEach((slideNum, idx) => {
        const item = document.createElement('div');
        item.className = `drawer-item ${idx === currentSlideIndex ? 'active' : ''}`;
        
        const img = document.createElement('img');
        if (workingTemplate) {
          img.src = workingTemplate(slideNum);
        }
        
        item.appendChild(img);
        item.onclick = () => {
          currentSlideIndex = idx;
          updateSlideImage();
          renderSlideDrawerItems();
        };
        drawer.appendChild(item);
      });
    }

    playBtn.onclick = () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? 'Pause' : 'Play';
    };

    prevBtn.onclick = () => {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        updateSlideImage();
        renderSlideDrawerItems();
      }
    };

    nextBtn.onclick = () => {
      if (currentSlideIndex < slideOrder.length - 1) {
        currentSlideIndex++;
        updateSlideImage();
        renderSlideDrawerItems();
      }
    };

    drawerToggle.onclick = () => {
      drawer.classList.toggle('open');
    };

    // Initial Load
    countAndLoadSlides();
  </script>
</body>
</html>
